name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      description: Paste text, not screenshots. Remove any keys or tokens first.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: commit hash or branch
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python and Node versions, browser
