# `docker compose up` runs the app in mock mode with no keys.
# Live mode: put keys in .env, set MOCK_MODE=false, then `docker compose --profile live up`.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MOCK_MODE: ${MOCK_MODE:-true}
      BIFROST_BASE_URL: http://bifrost:8080
    volumes:
      - app-data:/app/backend/data

  bifrost:
    # Behind a profile so a keyless `docker compose up` never depends on it.
    profiles: ["live"]
    image: maximhq/bifrost
    # The gateway holds provider keys; do not publish it beyond localhost without enabling Bifrost's own auth.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      BIFROST_VIRTUAL_KEY: ${BIFROST_VIRTUAL_KEY:-}
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-}
    volumes:
      - bifrost-data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro

volumes:
  app-data:
  bifrost-data:
