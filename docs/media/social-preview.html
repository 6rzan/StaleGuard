<!doctype html>
<!-- Social preview card. Fill the {{…}} values, open at exactly 1280x640, screenshot to docs/media/social-preview.png (< 1 MB).
     Then upload manually: repo Settings → General → Social preview → Edit → Upload an image. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social preview</title>
<style>
  :root { --bg: #f6f3ec; --fg: #1d1b16; --muted: #4a463d; --accent: #0f4c5c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", "Segoe UI", system-ui, sans-serif; color: var(--fg);
         display: grid; grid-template-columns: 1fr 420px; gap: 48px; padding: 80px; }
  .eyebrow { color: var(--accent); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 22px; }
  h1 { font-size: 84px; line-height: 1.02; letter-spacing: -.02em; margin-top: 20px; }
  p { color: var(--muted); font-size: 30px; line-height: 1.3; margin-top: 28px; max-width: 30ch; }
  .cmd { margin-top: 40px; font: 500 26px/1 "JetBrains Mono", Consolas, monospace; background: #fffdf8;
         border: 1px solid #ddd6c6; border-radius: 12px; padding: 18px 22px; display: inline-block; }
  .visual { align-self: center; border-radius: 20px; overflow: hidden; border: 1px solid #ddd6c6; background: #fffdf8; height: 420px; }
  .visual img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
</style>
</head>
<body>
  <main>
    <div class="eyebrow">Tavily + Bifrost</div>
    <h1>StaleGuard</h1>
    <p>Catch outdated facts in LLM answers: re-check each claim against the live web and score its freshness.</p>
    <div class="cmd">$ docker compose up</div>
  </main>
  <div class="visual"><img src="screenshot-report.png" alt=""></div>
</body>
</html>
