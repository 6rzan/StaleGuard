<!doctype html>
<!-- Social preview card, 1280x640. Rendered to social-preview.png by scripts/record-demo.mjs (needs screenshot-report.png beside it). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>StaleGuard social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0d0d0d; --fg: #e4e4e7; --muted: #a1a1aa; --accent: #39ff14; --line: #2a2a2e; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--fg);
         display: grid; grid-template-columns: 1fr 440px; gap: 48px; padding: 72px 0 72px 80px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .tile { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 14px; background: var(--accent); color: #000; }
  h1 { font-size: 76px; line-height: 1; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .eyebrow { margin-top: 30px; color: var(--accent); font: 500 22px/1 "JetBrains Mono", Consolas, monospace; letter-spacing: .06em; text-transform: uppercase; }
  p { color: var(--muted); font-size: 30px; line-height: 1.35; margin-top: 22px; max-width: 28ch; }
  .cmd { margin-top: 36px; font: 500 26px/1 "JetBrains Mono", Consolas, monospace; background: #161616;
         border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; display: inline-block; }
  .cmd b { color: var(--accent); font-weight: 500; }
  .visual { align-self: center; border-radius: 16px 0 0 16px; overflow: hidden; border: 1px solid var(--line); border-right: 0; height: 480px; box-shadow: 0 0 60px rgb(57 255 20 / .12); }
  .visual img { width: 960px; display: block; }
</style>
</head>
<body>
  <main>
    <div class="brand">
      <span class="tile"><svg viewBox="0 0 32 32" width="40" height="40"><path d="M16 2.5l11 4v8.2c0 7-4.6 12.2-11 14.8C9.6 26.9 5 21.7 5 14.7V6.5z" fill="#000"/><path d="M10.8 15.8l3.6 3.6 6.8-7.6" fill="none" stroke="#39ff14" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <h1>Stale<span>Guard</span></h1>
    </div>
    <div class="eyebrow">Tavily + Bifrost</div>
    <p>Catch outdated facts in LLM answers: re-check each claim against the live web and score its freshness.</p>
    <div class="cmd"><b>$</b> docker compose up</div>
  </main>
  <div class="visual"><img src="screenshot-report.png" alt=""></div>
</body>
</html>
